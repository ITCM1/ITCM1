name: Deploy ITCM GLOBAL AI to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itcm1-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Sync Gumroad token when supplied
        shell: bash
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$GUMROAD_ACCESS_TOKEN" ]; then
            printf "%s" "$GUMROAD_ACCESS_TOKEN" | npx wrangler secret put GUMROAD_ACCESS_TOKEN --name itcm1
            echo "Synced Worker secret: GUMROAD_ACCESS_TOKEN"
          else
            echo "GUMROAD_ACCESS_TOKEN not supplied; leaving existing Worker value unchanged."
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker health
        run: |
          set -euo pipefail
          health_ok=false
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' https://itcm1.ufstwold.workers.dev/api/health || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              health_ok=true
              break
            fi
            echo "Health check attempt $attempt returned HTTP $code"
            sleep 5
          done
          if [ "$health_ok" != "true" ]; then
            cat /tmp/health.json || true
            exit 1
          fi

      - name: Verify café product page
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/product-page.html -w '%{http_code}' https://itcm1.ufstwold.workers.dev/shop/cafe-owner-profit-kit)"
          if [ "$code" != "200" ]; then
            echo "Product page returned HTTP $code"
            head -c 2000 /tmp/product-page.html || true
            exit 1
          fi
          grep -qi "Run your café with" /tmp/product-page.html
          echo "Product page returned HTTP 200 and expected page content."
