name: Process agent queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: itcm-agent-queue-pump
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch one queued agent run
        env:
          AGENT_QUEUE_SECRET: ${{ secrets.AGENT_QUEUE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$AGENT_QUEUE_SECRET" ]; then
            echo "::error::AGENT_QUEUE_SECRET is not available to this workflow."
            exit 1
          fi

          http_code="$(curl --silent --show-error \
            --output response.txt \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $AGENT_QUEUE_SECRET" \
            -H "Content-Type: application/json" \
            https://itcm1.ufstwold.workers.dev/api/agent-queue/dispatch)" || {
              echo "::error::Could not reach the Cloudflare dispatch endpoint."
              exit 1
            }

          echo "Cloudflare HTTP status: $http_code"
          echo "Cloudflare response:"
          cat response.txt
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Agent queue dispatch returned HTTP $http_code."
            exit 1
          fi

          jq . response.txt
