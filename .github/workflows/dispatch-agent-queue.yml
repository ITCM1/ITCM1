name: Dispatch AI Agent Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itcm-agent-queue-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Claim and process one queued agent run
        env:
          AGENT_QUEUE_SECRET: ${{ secrets.AGENT_QUEUE_SECRET }}
        run: |
          if [ -z "$AGENT_QUEUE_SECRET" ]; then
            echo "AGENT_QUEUE_SECRET is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 70 \
            -X POST \
            -H "Authorization: Bearer $AGENT_QUEUE_SECRET" \
            https://itcm1.ufstwold.workers.dev/api/agent-queue/dispatch
